[package]
name = "drift-wallpaper"
version = "0.1.0"
description = "A calm motion wallpaper app for macOS"
authors = ["Drift"]
edition = "2021"

[[bin]]
name = "Drift"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.10.3", features = ["image-png", "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-autostart = "=2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSScreen"] }
